appId: com.zebovision.waterdemo
productName: ZeboVision
# Electron 前端编译文件归档进 app.asar；可执行的 CPython 必须作为额外资源放在外面。
asar: true
directories:
  output: dist
files:
  - out/**
  - package.json
# 把打包好的独立 Python 复制到 resources/backend，供 BackendManager 读取 manifest.json。
extraResources:
  - from: build/backend
    to: backend
  # Keep the app's supplied ICO available outside app.asar at runtime.
  - from: resources/icon.ico
    to: icon.ico
win:
  icon: resources/icon.ico
  artifactName: ZeboVision-${version}-${arch}.${ext}
